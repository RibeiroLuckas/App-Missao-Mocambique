<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06223e"/>
      <stop offset="50%" stop-color="#041d34"/>
      <stop offset="100%" stop-color="#020f1c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#0d3b66" stroke-width="4"/>

  <!-- Subtle Circular Radial Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>

  <!-- Glowing Emblem Center -->
  <!-- Globe Grid -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="130"/>
    <ellipse cx="256" cy="256" rx="65" ry="130"/>
    <line x1="126" y1="256" x2="386" y2="256"/>
    <line x1="140" y1="190" x2="372" y2="190"/>
    <line x1="140" y1="322" x2="372" y2="322"/>
  </g>

  <!-- Open Bible (Solid Gold & White) -->
  <g transform="translate(256, 310) scale(1.15)">
    <!-- Bible Pages -->
    <path d="M -80,-10 C -40,-25 0,-15 0,0 C 0,-15 40,-25 80,-10 L 76,40 C 40,25 0,35 0,20 C 0,35 -40,25 -76,40 Z" fill="#ffffff" filter="url(#glow)"/>
    <path d="M -80,-10 C -40,-25 0,-15 0,0 C 0,-15 40,-25 80,-10 L 76,40 C 40,25 0,35 0,20 C 0,35 -40,25 -76,40 Z" fill="none" stroke="#d97706" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#b45309" stroke-width="3"/>
  </g>

  <!-- Radiant Golden Cross -->
  <g transform="translate(256, 210)">
    <!-- Glow Backdrop -->
    <circle cx="0" cy="0" r="50" fill="url(#gold)" opacity="0.25" filter="url(#glow)"/>
    <!-- Vertical Cross Beam -->
    <rect x="-12" y="-85" width="24" height="150" rx="6" fill="url(#gold)" filter="url(#glow)"/>
    <rect x="-9" y="-82" width="18" height="144" rx="4" fill="#fef08a" opacity="0.6"/>
    <!-- Horizontal Cross Beam -->
    <rect x="-55" y="-45" width="110" height="24" rx="6" fill="url(#gold)" filter="url(#glow)"/>
    <rect x="-52" y="-42" width="104" height="18" rx="4" fill="#fef08a" opacity="0.6"/>
    <!-- Heart of Light at Intersection -->
    <circle cx="0" cy="-33" r="10" fill="#ffffff"/>
  </g>

  <!-- Tiny Mission Star -->
  <polygon points="256,92 260,105 273,105 262,113 266,126 256,118 246,126 250,113 239,105 252,105" fill="#fde047"/>
</svg>
